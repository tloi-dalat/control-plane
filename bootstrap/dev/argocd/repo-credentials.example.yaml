# ArgoCD needs read access to this (private) repo. Use a read-only deploy key:
#   ssh-keygen -t ed25519 -N '' -f argocd-deploy-key
#   GitHub → tloi-dalat/control-plane → Settings → Deploy keys → add argocd-deploy-key.pub (read-only)
# Then create the Secret directly on the cluster — NEVER commit it:
#   kubectl -n argocd create secret generic control-plane-repo \
#     --from-literal=type=git \
#     --from-literal=url=git@github.com:tloi-dalat/control-plane.git \
#     --from-file=sshPrivateKey=argocd-deploy-key
#   kubectl -n argocd label secret control-plane-repo argocd.argoproj.io/secret-type=repository
#   shred -u argocd-deploy-key
#
# With an SSH URL, change repoURL in clusters/dev/application-set.yaml to
# git@github.com:tloi-dalat/control-plane.git as well.
# (If you make this repo public instead, skip all of this.)
