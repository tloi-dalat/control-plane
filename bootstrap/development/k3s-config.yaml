# Copy to /etc/rancher/k3s/config.yaml on the dev VPS BEFORE installing k3s.
write-kubeconfig-mode: "0600"
disable:
  - traefik     # no ingress controller: cloudflared routes straight to Services
  - servicelb   # nothing uses type: LoadBalancer; no public ports
# One node: route pod traffic directly instead of VXLAN, so k3s never opens
# UDP 8472 on a VPS that has no firewall in front of it.
flannel-backend: host-gw
node-label:
  - tloi.vn/data-node=true   # media/problem volumes are pinned to this node
# Keep k3s's embedded NetworkPolicy controller ON (the default) — it is what
# confines the judge. Never add `disable-network-policy: true`.
kubelet-arg:
  # MySQL (≈1.3 GB) and the OS run outside Kubernetes on this VPS. Reserve it so
  # the scheduler doesn't hand that memory to pods.
  - system-reserved=memory=2Gi
  - kube-reserved=memory=256Mi
