# ArgoCD needs read access to this (private) repo. It uses a GitHub App owned by
# the tloi-dalat org (GitHub discourages deploy keys in organizations), and
# mints its own short-lived tokens from the App's private key: nothing expires.
#
# 1. GitHub → tloi-dalat → Settings → Developer settings → GitHub Apps → New GitHub App
#      name: tloi-argocd   homepage: https://github.com/tloi-dalat   Webhook: off
#      Repository permissions → Contents: Read-only   (Metadata: Read-only is automatic)
#      "Only on this account". Create, note the App ID, generate a private key (.pem).
# 2. Install App → tloi-dalat → Only select repositories → control-plane.
#    The installation ID is the number at the end of the installation's settings URL.
# 3. Create the Secret directly on the cluster (from your laptop) — NEVER commit it:
#      kubectl -n argocd create secret generic control-plane-repo \
#        --from-literal=type=git \
#        --from-literal=url=https://github.com/tloi-dalat/control-plane.git \
#        --from-literal=githubAppID=<APP_ID> \
#        --from-literal=githubAppInstallationID=<INSTALLATION_ID> \
#        --from-file=githubAppPrivateKey=<path/to/tloi-argocd.private-key.pem>
#      kubectl -n argocd label secret control-plane-repo argocd.argoproj.io/secret-type=repository
#    Then store the .pem in your password manager and delete the file.
#
# The url must match repoURL in clusters/development/application-set.yaml.
