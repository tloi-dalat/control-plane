name: deployments
on:
  push:
    branches: [main]
    paths: ['clusters/*/*/*/values.yaml']
jobs:
  record:
    permissions:
      contents: read
    uses: tloi-dalat/reusable-workflow/.github/workflows/control-plane-deployments.yaml@main
    with:
      before: ${{ github.event.before }}
      after: ${{ github.sha }}
    secrets: inherit
