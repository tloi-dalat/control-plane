# Each push to main that changes an image tag becomes a Deployment in the app
# repo it was built from (Deployments tab, environments development and
# production): human merges and repo-dispatch.yaml's bot commits alike.
name: deployments
on:
  push:
    branches: [main]
    paths: ['clusters/*/*/*/values.yaml']
jobs:
  record:
    permissions:
      contents: read
    uses: tloi-dalat/reusable-workflow/.github/workflows/control-plane-deployments.yaml@main
    with:
      before: ${{ github.event.before }}
      after: ${{ github.sha }}
    secrets: inherit
