name: lint
on:
  pull_request:
    branches: [main]
concurrency:
  group: lint-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    permissions:
      contents: read
    uses: tloi-dalat/reusable-workflow/.github/workflows/control-plane-lint.yaml@main
    with:
      kubernetes-version: 1.36.5
