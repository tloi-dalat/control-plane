name: dispatch
run-name: Sync ${{ github.event.client_payload.environment }}/${{ github.event.client_payload.namespace }} ${{ github.event.client_payload.apps }} → ${{ github.event.client_payload.version }} (${{ github.event.client_payload.actor }})
on:
  repository_dispatch:
    types: [sync-version]
jobs:
  sync:
    permissions:
      contents: read
    uses: tloi-dalat/reusable-workflow/.github/workflows/control-plane-repo-dispatch.yaml@main
    secrets: inherit
