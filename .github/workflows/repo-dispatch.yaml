name: dispatch
run-name: Sync ${{ github.event.client_payload.environment }}/${{ github.event.client_payload.namespace }} ${{ github.event.client_payload.apps }} → ${{ github.event.client_payload.version }} (${{ github.event.client_payload.actor }})
on:
  repository_dispatch:
    types: [sync-version]
jobs:
  sync:
    permissions:
      contents: write
    uses: tloi-dalat/reusable-workflow/.github/workflows/control-plane-repo-dispatch.yaml@main

  # The bot commit is pushed with GITHUB_TOKEN, which triggers no workflow, so
  # deployments.yaml never sees it: record its deployment here.
  deployments:
    needs: [sync]
    if: needs.sync.outputs.commit != ''
    permissions:
      contents: read
    uses: tloi-dalat/reusable-workflow/.github/workflows/control-plane-deployments.yaml@main
    with:
      after: ${{ needs.sync.outputs.commit }}
    secrets: inherit   # org secrets CI_APP_ID / CI_APP_PRIVATE_KEY (the CI GitHub App)
