name: Lint
on:
  pull_request:
    branches: [main]
concurrency:
  group: lint-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    permissions:
      contents: read
    uses: tloi-dalat/reuse-workflow/.github/workflows/control-plane-lint.yaml@main
    with:
      kubernetes-version: 1.36.5   # match the k3s version in bootstrap/dev/README.md
