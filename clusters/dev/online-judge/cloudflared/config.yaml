# Locally-managed Cloudflare Tunnel. Created with:
#   cloudflared tunnel create tloj-dev
# which prints the UUID below and writes the credentials JSON that
# bootstrap/seal-secrets.sh seals into the cloudflared-credentials Secret.
tunnel: 00000000-0000-0000-0000-000000000000   # CHANGEME: tunnel UUID
credentials-file: /etc/cloudflared/creds/credentials.json
metrics: 0.0.0.0:2000
no-autoupdate: true

# Rules match top to bottom; paths are Go regexes and are NOT stripped.
# No hostname on any rule: every hostname routed to this tunnel (the test name
# during side-by-side, then oj-dev.tloi.vn) gets the same routing.
ingress:
  # Browser websocket (daemon accepts any path).
  - path: ^/event/
    service: http://online-judge-wsevent:15100
  # Long-poll fallback. The daemon REQUIRES the /channels/ prefix — verified;
  # an nginx-style prefix strip would 404 here.
  - path: ^/channels/
    service: http://online-judge-wsevent:15102
  # User uploads (URL prefixes from dmoj/settings.py).
  - path: ^/(martor|pdf|submission_file|static-upload)/
    service: http://online-judge-media:8080
  # Everything else: Django (WhiteNoise serves /static/ and root files).
  - service: http://online-judge-site:8000
