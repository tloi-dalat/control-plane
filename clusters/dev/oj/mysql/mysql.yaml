# MySQL stays on the VPS (systemd), not in Kubernetes. Pods reach it as
# `mysql` through this selector-less Service, so the address lives in exactly
# one place and values.yaml reads the same in every environment.
apiVersion: v1
kind: Service
metadata:
  name: mysql
spec:
  ports:
    - { name: mysql, port: 3306, targetPort: 3306, protocol: TCP }
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: mysql-host
  labels:
    kubernetes.io/service-name: mysql
    endpointslice.kubernetes.io/managed-by: control-plane.tloi.vn
addressType: IPv4
ports:
  - { name: mysql, port: 3306, protocol: TCP }
endpoints:
  # 10.42.0.1 is the node itself as seen from its pods (k3s flannel bridge on
  # the first/only node), so this works whatever the VPS's own IPs are.
  # MySQL must listen on it (bind-address 0.0.0.0) and the firewall must allow
  # 3306 from 10.42.0.0/16 only — see bootstrap/dev/README.md, step 2.
  - addresses: ["10.42.0.1"]
