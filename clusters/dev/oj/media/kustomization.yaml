apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmGlobals:
  chartHome: /tmp/charts
helmCharts:
  - repo: oci://ghcr.io/tloi-dalat/charts
    name: app
    version: 0.1.0
    namespace: oj
    releaseName: oj-media
    valuesFile: values.yaml
# Hash-suffixed name: editing nginx.conf changes the pod spec, so it rolls.
configMapGenerator:
  - name: oj-media-nginx
    files: [default.conf=nginx.conf]
