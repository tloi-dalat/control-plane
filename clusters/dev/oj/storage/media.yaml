# User uploads (MEDIA_ROOT): martor images, PDF statements, submission files. Nothing regenerates these — they are what the daily backup exists for.
#
# SAFETY: persistentVolumeReclaimPolicy Retain + Prune=false/Delete=false.
# The ApplicationSet prunes; without these, a renamed directory or a bad revert
# could delete the volume. With them, the worst case is an unbound volume you
# reattach by hand — the files are never touched.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: oj-dev-media
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  capacity:
    storage: 50Gi
  accessModes: [ReadWriteOnce]       # one node; several pods on it may mount it
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-static
  local:
    path: /home/tloi/media   # CHANGEME: existing directory on the dev VPS (must exist)
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - { key: tloi.vn/data-node, operator: In, values: ["true"] }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: oj-media
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  storageClassName: local-static
  volumeName: oj-dev-media                # bind to exactly this volume
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 50Gi
