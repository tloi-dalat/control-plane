kind: StatefulSet
replicaCount: 1
image:
  repository: ghcr.io/tloi-dalat/oj-judge
  tag: main-feba6cb
args: ["run", "-c", "/config/judge.yml", "online-judge-bridge"]
env:
  DMOJ_SKIP_DEV_INSTALL: "1"
  DMOJ_JUDGE_INDEX:
    valueFrom: { fieldRef: { fieldPath: "metadata.labels['apps.kubernetes.io/pod-index']" } }
  DMOJ_JUDGE_KEY:
    valueFrom: { secretKeyRef: { name: online-judge-judge-env, key: DMOJ_JUDGE_KEY } }
  DMOJ_JUDGE_NAME: judge-$(DMOJ_JUDGE_INDEX)
securityContext:
  allowPrivilegeEscalation: false
  capabilities: { add: ["SYS_PTRACE"] }
  seccompProfile: { type: Unconfined }
resources:
  requests: { cpu: 500m, memory: 512Mi }
  limits: { cpu: "2", memory: 1536Mi }
volumes:
  - name: config
    configMap: { name: online-judge-judge-config }
  - name: problems
    persistentVolumeClaim: { claimName: online-judge-problems, readOnly: true }
volumeMounts:
  - { name: config, mountPath: /config, readOnly: true }
  - { name: problems, mountPath: /problems, readOnly: true }
networkPolicy:
  enabled: true
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - podSelector: { matchLabels: { app.kubernetes.io/name: online-judge-bridge } }
      ports:
        - { port: 9999, protocol: TCP }
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
