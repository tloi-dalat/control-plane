# Infisical  TLOJ project → environment "development" → folder /online-judge/judge
#   JUDGE__KEY
# becomes Secret online-judge-judge-env. The judge runs untrusted code, so it
# gets a Secret holding ONLY its own key, never the site's.
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: online-judge-judge-env
  namespace: online-judge
spec:
  infisicalAuthRef: { name: tloj, namespace: infisical }
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectSlug: control-plane   # same as online-judge-core-env.yaml
      environmentSlug: development
      secretPath: /online-judge/judge
      recursive: false
  targets:
    - name: online-judge-judge-env
      namespace: online-judge
      kind: Secret
      creationPolicy: Owner
