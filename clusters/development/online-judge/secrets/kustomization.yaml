# App secrets come from Infisical (values typed in the web UI, synced by the
# operator in clusters/development/infisical/). Only the Infisical folder →
# Secret mapping is committed, never a value.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - online-judge-core-env.yaml
  - online-judge-judge-env.yaml
