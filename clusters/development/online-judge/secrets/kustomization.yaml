# App secrets come from Infisical (values typed in the web UI, synced by the
# operator in clusters/development/infisical/). Nothing here is committed in
# plain or sealed form; the tunnel credentials live with the tunnel in
# clusters/development/cloudflared/tunnel/.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - online-judge-core-env.yaml
  - online-judge-judge-env.yaml
