# The online judge itself: site (web), bridge (judges ↔ site) and celery
# (background tasks). One image, one shared values.yaml, one ArgoCD app.
# Sharing an app means the migrate PreSync hook (site.yaml) runs before ANY of
# site, bridge or celery is updated, so none of them meets a schema it doesn't
# expect.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmGlobals:
  chartHome: /tmp/charts
helmCharts:
  - repo: oci://ghcr.io/tloi-dalat/charts
    name: app
    version: 0.1.0
    namespace: online-judge
    releaseName: online-judge-site
    valuesFile: values.yaml
    additionalValuesFiles: [site.yaml]
  - repo: oci://ghcr.io/tloi-dalat/charts
    name: app
    version: 0.1.0
    namespace: online-judge
    releaseName: online-judge-bridge
    valuesFile: values.yaml
    additionalValuesFiles: [bridge.yaml]
  - repo: oci://ghcr.io/tloi-dalat/charts
    name: app
    version: 0.1.0
    namespace: online-judge
    releaseName: online-judge-celery
    valuesFile: values.yaml
    additionalValuesFiles: [celery.yaml]
# Restart the pods when Infisical changes a secret they read (the operator
# watches workloads carrying this annotation).
patches:
  - target: { group: apps, kind: Deployment|StatefulSet }
    patch: |-
      apiVersion: apps/v1
      kind: Deployment   # ignored: `target` picks the resources
      metadata:
        name: any
        annotations:
          secrets.infisical.com/auto-reload: "true"
