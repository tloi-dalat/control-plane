replicaCount: 1
strategy: { type: Recreate }
command: ["python", "manage.py", "runbridged"]
ports:
  - { name: judge, containerPort: 9999 }
  - { name: django, containerPort: 9998 }
probes:
  readiness: { tcpSocket: { port: judge }, periodSeconds: 10 }
  liveness: { tcpSocket: { port: judge }, periodSeconds: 20, failureThreshold: 6 }
resources:
  requests: { cpu: 50m, memory: 192Mi }
  limits: { cpu: 500m, memory: 384Mi }
volumes:
  - name: problems
    persistentVolumeClaim: { claimName: online-judge-problems, readOnly: true }
volumeMounts:
  - { name: problems, mountPath: /problems, readOnly: true }
