replicaCount: 2
strategy:
  type: RollingUpdate
  rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
ports:
  - { name: http, containerPort: 8000 }
probes:
  readiness: { tcpSocket: { port: http }, periodSeconds: 10 }
  liveness: { tcpSocket: { port: http }, periodSeconds: 20, failureThreshold: 6 }
resources:
  requests: { cpu: 200m, memory: 384Mi }
  limits: { cpu: "1", memory: 768Mi }

migrate:
  enabled: true
  command: ["python", "manage.py", "migrate", "--noinput"]
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }
