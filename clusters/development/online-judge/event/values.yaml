image:
  repository: ghcr.io/tloi-dalat/online-judge-event
  tag: main-a6325cd
replicaCount: 1
strategy: { type: Recreate }
ports:
  - { name: ws, containerPort: 15100 }
  - { name: post, containerPort: 15101 }
  - { name: poll, containerPort: 15102 }
probes:
  readiness: { tcpSocket: { port: poll }, periodSeconds: 10 }
  liveness: { tcpSocket: { port: poll }, periodSeconds: 20, failureThreshold: 6 }
podSecurityContext: { runAsUser: 1000, runAsGroup: 1000, runAsNonRoot: true }
resources:
  requests: { cpu: 20m, memory: 64Mi }
  limits: { cpu: 250m, memory: 192Mi }
