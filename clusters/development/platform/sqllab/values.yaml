image:
  repository: bytebase/bytebase
  tag: 3.24.0
strategy: { type: Recreate }
args: ["--port", "3000", "--data", "/var/opt/bytebase"]
ports:
  - { name: http, containerPort: 3000 }
probes:
  startup: { httpGet: { path: /healthz, port: http }, periodSeconds: 10, failureThreshold: 30 }
  readiness: { httpGet: { path: /healthz, port: http }, periodSeconds: 10 }
  liveness: { httpGet: { path: /healthz, port: http }, periodSeconds: 30, timeoutSeconds: 10, failureThreshold: 6 }
resources:
  requests: { cpu: 100m, memory: 512Mi }
  limits: { cpu: "1", memory: 2Gi }
volumes:
  - name: data
    persistentVolumeClaim: { claimName: sqllab }
volumeMounts:
  - { name: data, mountPath: /var/opt/bytebase }
networkPolicy:
  enabled: true
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: cloudflared } }
      ports:
        - { port: 3000, protocol: TCP }
