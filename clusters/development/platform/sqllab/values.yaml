image:
  repository: dbgate/dbgate
  tag: 7.3.2
strategy: { type: Recreate }
env:
  SKIP_ALL_AUTH: "1"
  CONNECTIONS: replica
  LABEL_replica: MariaDB replica
  ENGINE_replica: mysql@dbgate-plugin-mysql
  SERVER_replica: mariadb-secondary.database.svc.cluster.local
  PORT_replica: "3306"
  USER_replica: sqllab
  READONLY_replica: "1"
envFrom:
  - secretRef: { name: platform-sqllab-env }
ports:
  - { name: http, containerPort: 3000 }
probes:
  readiness: { httpGet: { path: /, port: http }, periodSeconds: 10 }
  liveness: { httpGet: { path: /, port: http }, periodSeconds: 20, failureThreshold: 6 }
resources:
  requests: { cpu: 20m, memory: 128Mi }
  limits: { cpu: 500m, memory: 512Mi }
volumes:
  - name: data
    persistentVolumeClaim: { claimName: sqllab }
volumeMounts:
  - { name: data, mountPath: /root/.dbgate }
networkPolicy:
  enabled: true
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: cloudflared } }
      ports:
        - { port: 3000, protocol: TCP }
