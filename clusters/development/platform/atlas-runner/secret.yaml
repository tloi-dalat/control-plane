apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: atlas-runner-env
  namespace: platform
spec:
  infisicalAuthRef: { name: tloi, namespace: infisical }
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectSlug: control-plane
      environmentSlug: development
      secretPath: /platform/atlas-runner
      recursive: false
  targets:
    - name: atlas-runner-env
      namespace: platform
      kind: Secret
      creationPolicy: Owner
