githubConfigUrl: https://github.com/tloi-dalat/atlas-migration
githubConfigSecret: atlas-runner-env
runnerScaleSetName: atlas-development
minRunners: 0
maxRunners: 1
controllerServiceAccount:
  namespace: platform
  name: arc-gha-rs-controller
template:
  spec:
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:2.338.2
        command: ["/home/runner/run.sh"]
        env:
          - { name: MARIADB_HOST, value: mariadb-primary.database.svc.cluster.local }
          - { name: MARIADB_PORT, value: "3306" }
          - name: MARIADB_PASSWORD
            valueFrom:
              secretKeyRef: { name: atlas-runner-env, key: MARIADB_PASSWORD }
          - { name: POSTGRES_HOST, value: postgres-primary.database.svc.cluster.local }
          - { name: POSTGRES_PORT, value: "5432" }
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef: { name: atlas-runner-env, key: POSTGRES_PASSWORD }
          - { name: SQLLAB_URL, value: http://sqllab.platform.svc.cluster.local:3000 }
          - name: SQLLAB_SERVICE_ACCOUNT
            valueFrom:
              secretKeyRef: { name: atlas-runner-env, key: SQLLAB_SERVICE_ACCOUNT }
          - name: SQLLAB_SERVICE_KEY
            valueFrom:
              secretKeyRef: { name: atlas-runner-env, key: SQLLAB_SERVICE_KEY }
        resources:
          requests: { cpu: 50m, memory: 128Mi }
          limits: { cpu: "1", memory: 1Gi }
