githubConfigUrl: https://github.com/tloi-dalat/atlas-migration
githubConfigSecret: atlas-runner-env
runnerScaleSetName: atlas-development
minRunners: 0
maxRunners: 1
controllerServiceAccount:
  namespace: platform
  name: arc-gha-rs-controller
template:
  spec:
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:2.338.2
        command: ["/home/runner/run.sh"]
        env:
          - { name: DATABASE_HOST, value: mariadb-primary.database.svc.cluster.local }
          - { name: DATABASE_PORT, value: "3306" }
          - { name: DATABASE_USER, value: atlas }
          - name: DATABASE_PASSWORD
            valueFrom:
              secretKeyRef: { name: atlas-runner-env, key: DATABASE_PASSWORD }
        resources:
          requests: { cpu: 100m, memory: 256Mi }
          limits: { cpu: "1", memory: 1Gi }
