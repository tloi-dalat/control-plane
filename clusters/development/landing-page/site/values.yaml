url: https://tloi.shop
image:
  repository: ghcr.io/tloi-dalat/landing-page-site
  tag: main-98e2664
replicaCount: 1
ports:
  - { name: http, containerPort: 8080 }
probes:
  readiness: { httpGet: { path: /, port: http }, periodSeconds: 10 }
  liveness: { httpGet: { path: /, port: http }, periodSeconds: 20, failureThreshold: 6 }
volumes:
  - name: tmp
    emptyDir: {}
volumeMounts:
  - { name: tmp, mountPath: /tmp }
resources:
  requests: { cpu: 10m, memory: 16Mi }
  limits: { cpu: 250m, memory: 64Mi }
networkPolicy:
  enabled: true
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: cloudflared } }
      ports:
        - { port: 8080, protocol: TCP }
