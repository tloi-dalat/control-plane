apiVersion: k8s.mariadb.com/v1alpha1
kind: User
metadata:
  name: sqllab-read
spec:
  name: sqllab_read
  mariaDbRef: { name: mariadb }
  host: "10.42.%"
  passwordSecretKeyRef: { name: mariadb-env, key: SQLLAB_READ_PASSWORD }
  maxUserConnections: 10
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Grant
metadata:
  name: sqllab-read-online-judge
spec:
  mariaDbRef: { name: mariadb }
  username: sqllab_read
  host: "10.42.%"
  database: online_judge
  table: "*"
  privileges: [SELECT]
