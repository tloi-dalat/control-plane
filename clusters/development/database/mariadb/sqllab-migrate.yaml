apiVersion: k8s.mariadb.com/v1alpha1
kind: User
metadata:
  name: sqllab-migrate
spec:
  name: sqllab_migrate
  mariaDbRef: { name: mariadb }
  host: "10.42.%"
  passwordSecretKeyRef: { name: mariadb-env, key: SQLLAB_MIGRATE_PASSWORD }
  maxUserConnections: 10
  cleanupPolicy: Skip
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Grant
metadata:
  name: sqllab-migrate
spec:
  mariaDbRef: { name: mariadb }
  username: sqllab_migrate
  host: "10.42.%"
  database: "*"
  table: "*"
  privileges: [PROCESS, SHOW DATABASES, REPLICATION CLIENT]
  cleanupPolicy: Skip
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Grant
metadata:
  name: sqllab-migrate-online-judge
spec:
  mariaDbRef: { name: mariadb }
  username: sqllab_migrate
  host: "10.42.%"
  database: online_judge
  table: "*"
  privileges: [SELECT, INSERT, UPDATE, DELETE, CREATE, ALTER, DROP, INDEX, REFERENCES, CREATE VIEW, SHOW VIEW, TRIGGER, LOCK TABLES, EXECUTE, CREATE ROUTINE, ALTER ROUTINE, EVENT]
  cleanupPolicy: Skip
