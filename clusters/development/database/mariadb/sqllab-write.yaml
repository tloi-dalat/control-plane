apiVersion: k8s.mariadb.com/v1alpha1
kind: User
metadata:
  name: sqllab-write
spec:
  name: sqllab_write
  mariaDbRef: { name: mariadb }
  host: "10.42.%"
  passwordSecretKeyRef: { name: mariadb-env, key: SQLLAB_WRITE_PASSWORD }
  maxUserConnections: 10
  cleanupPolicy: Skip
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Grant
metadata:
  name: sqllab-write
spec:
  mariaDbRef: { name: mariadb }
  username: sqllab_write
  host: "10.42.%"
  database: "*"
  table: "*"
  privileges: [PROCESS, SHOW DATABASES, REPLICATION CLIENT]
  cleanupPolicy: Skip
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Grant
metadata:
  name: sqllab-write-online-judge
spec:
  mariaDbRef: { name: mariadb }
  username: sqllab_write
  host: "10.42.%"
  database: online_judge
  table: "*"
  privileges: [SELECT, INSERT, UPDATE, DELETE, SHOW VIEW, LOCK TABLES]
  cleanupPolicy: Skip
