apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: postgres-roles
  namespace: database
spec:
  infisicalAuthRef: { name: tloi, namespace: infisical }
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectSlug: control-plane
      environmentSlug: development
      secretPath: /database/postgres
      recursive: false
  targets:
    - name: postgres-atlas
      namespace: database
      kind: Secret
      secretType: kubernetes.io/basic-auth
      creationPolicy: Owner
      metadata:
        labels: { cnpg.io/reload: "true" }
        annotations: {}
      template:
        engineVersion: v1
        data:
          username: atlas
          password: "{{ .ATLAS_PASSWORD.Value }}"
    - name: postgres-online-quiz
      namespace: database
      kind: Secret
      secretType: kubernetes.io/basic-auth
      creationPolicy: Owner
      metadata:
        labels: { cnpg.io/reload: "true" }
        annotations: {}
      template:
        engineVersion: v1
        data:
          username: online_quiz
          password: "{{ .ONLINE_QUIZ_PASSWORD.Value }}"
    - name: postgres-developer
      namespace: database
      kind: Secret
      secretType: kubernetes.io/basic-auth
      creationPolicy: Owner
      metadata:
        labels: { cnpg.io/reload: "true" }
        annotations: {}
      template:
        engineVersion: v1
        data:
          username: developer
          password: "{{ .DEVELOPER_PASSWORD.Value }}"
    - name: postgres-sqllab-read
      namespace: database
      kind: Secret
      secretType: kubernetes.io/basic-auth
      creationPolicy: Owner
      metadata:
        labels: { cnpg.io/reload: "true" }
        annotations: {}
      template:
        engineVersion: v1
        data:
          username: sqllab_read
          password: "{{ .SQLLAB_READ_PASSWORD.Value }}"
    - name: postgres-sqllab-write
      namespace: database
      kind: Secret
      secretType: kubernetes.io/basic-auth
      creationPolicy: Owner
      metadata:
        labels: { cnpg.io/reload: "true" }
        annotations: {}
      template:
        engineVersion: v1
        data:
          username: sqllab_write
          password: "{{ .SQLLAB_WRITE_PASSWORD.Value }}"
