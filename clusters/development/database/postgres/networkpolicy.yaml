apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
spec:
  podSelector:
    matchLabels: { cnpg.io/cluster: postgres }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: online-quiz } }
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: platform } }
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: cloudflared } }
      ports:
        - { port: 5432, protocol: TCP }
