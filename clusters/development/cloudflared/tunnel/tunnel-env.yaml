apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: tunnel-env
  namespace: cloudflared
spec:
  infisicalAuthRef: { name: tloi, namespace: infisical }
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectSlug: control-plane
      environmentSlug: development
      secretPath: /cloudflared
      recursive: false
  targets:
    - name: tunnel-env
      namespace: cloudflared
      kind: Secret
      creationPolicy: Owner
