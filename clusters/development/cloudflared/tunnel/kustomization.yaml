apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - tunnel-env.yaml
helmGlobals:
  chartHome: /tmp/charts
helmCharts:
  - repo: oci://ghcr.io/tloi-dalat/charts
    name: app
    version: 0.3.0
    namespace: cloudflared
    releaseName: tunnel
    valuesFile: values.yaml
patches:
  - target: { group: apps, kind: Deployment|StatefulSet }
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: any
        annotations:
          secrets.infisical.com/auto-reload: "true"
