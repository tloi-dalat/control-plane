# Locally-managed Cloudflare Tunnel. Created with:
#   cloudflared tunnel create control-plane-development
# which prints the UUID below and writes the credentials JSON that
# bootstrap/seal-secrets.sh seals into the cloudflared-credentials Secret.
tunnel: 3a9981bf-783f-40f6-87d9-c5552c3c7bce
credentials-file: /etc/cloudflared/creds/credentials.json
metrics: 0.0.0.0:2000
no-autoupdate: true

# Rules match top to bottom; paths are Go regexes and are NOT stripped.
# The tunnel lives in its own namespace and serves every service, so each rule
# names its hostname and points at <service>.<namespace>.svc.cluster.local.
# A new hostname also needs, once:  cloudflared tunnel route dns control-plane-development <hostname>
ingress:
  # --- argocd -----------------------------------------------------------------
  # GitHub push webhook → ArgoCD, so a control-plane commit deploys in seconds
  # instead of at the next 3-minute poll. Only this one path of ArgoCD is
  # reachable; the payload is checked against webhook.github.secret in
  # argocd-secret.
  - hostname: argocd-hook.tloi.shop
    path: ^/api/webhook$
    service: https://argocd-server.argocd.svc.cluster.local:443
    originRequest:
      noTLSVerify: true   # argocd-server's self-signed in-cluster cert

  # --- online-judge -------------------------------------------------------------
  # Test hostname during side-by-side; becomes oj-dev.tloi.vn at cutover.
  # Browser websocket (daemon accepts any path).
  - hostname: oj.tloi.shop
    path: ^/event/
    service: http://online-judge-wsevent.online-judge.svc.cluster.local:15100
  # Long-poll fallback. The daemon REQUIRES the /channels/ prefix — verified;
  # an nginx-style prefix strip would 404 here.
  - hostname: oj.tloi.shop
    path: ^/channels/
    service: http://online-judge-wsevent.online-judge.svc.cluster.local:15102
  # User uploads (URL prefixes from dmoj/settings.py).
  - hostname: oj.tloi.shop
    path: ^/(martor|pdf|submission_file|static-upload)/
    service: http://online-judge-media.online-judge.svc.cluster.local:8080
  # Everything else: Django (WhiteNoise serves /static/ and root files).
  - hostname: oj.tloi.shop
    service: http://online-judge-site.online-judge.svc.cluster.local:8000

  # Anything else, including unknown paths on argocd-hook: 404.
  - service: http_status:404
