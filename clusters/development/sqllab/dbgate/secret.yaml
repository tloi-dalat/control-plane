apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: sqllab-dbgate-env
  namespace: sqllab
spec:
  infisicalAuthRef: { name: tloi, namespace: infisical }
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectSlug: control-plane
      environmentSlug: development
      secretPath: /sqllab/dbgate
      recursive: false
  targets:
    - name: sqllab-dbgate-env
      namespace: sqllab
      kind: Secret
      creationPolicy: Owner
