oauthSecretVolume:
  secret:
    secretName: operator-env
    items:
      - { key: CLIENT_ID, path: client_id }
      - { key: CLIENT_SECRET, path: client_secret }
operatorConfig:
  hostname: operator-development
  defaultTags: ["tag:k8s-operator"]
  resources:
    requests: { cpu: 10m, memory: 64Mi }
    limits: { memory: 256Mi }
proxyConfig:
  defaultTags: "tag:k8s-development"
