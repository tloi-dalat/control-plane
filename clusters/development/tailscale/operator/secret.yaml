apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: operator-env
  namespace: tailscale
spec:
  infisicalAuthRef: { name: tloi, namespace: infisical }
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectSlug: control-plane
      environmentSlug: development
      secretPath: /tailscale/operator
      recursive: false
  targets:
    - name: operator-env
      namespace: tailscale
      kind: Secret
      creationPolicy: Owner
