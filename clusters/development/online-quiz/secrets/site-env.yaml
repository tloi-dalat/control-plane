apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: site-env
  namespace: online-quiz
spec:
  infisicalAuthRef: { name: tloi, namespace: infisical }
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectSlug: control-plane
      environmentSlug: development
      secretPath: /online-quiz/site
      recursive: false
  targets:
    - name: site-env
      namespace: online-quiz
      kind: Secret
      creationPolicy: Owner
