apiVersion: v1
kind: PersistentVolume
metadata:
  name: database-prd-mariadb-0
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  capacity:
    storage: 50Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-static
  claimRef:
    namespace: database
    name: storage-mariadb-0
  local:
    path: /home/tloi/data/database/mariadb-0
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - { key: tloi.vn/data-node, operator: In, values: ["true"] }
---
