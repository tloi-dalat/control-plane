apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: mariadb-env
  namespace: database
spec:
  infisicalAuthRef: { name: tloi, namespace: infisical }
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectSlug: control-plane
      environmentSlug: production
      secretPath: /database/mariadb
      recursive: false
  targets:
    - name: mariadb-env
      namespace: database
      kind: Secret
      creationPolicy: Owner
