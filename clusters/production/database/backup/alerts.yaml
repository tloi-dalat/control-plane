apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: backup
spec:
  groups:
    - name: backup.database
      rules:
        - alert: DatabaseBackupFailed
          expr: k8up_schedule_last_job_succeeded{exported_namespace="database", jobType="backup"} == 0
          labels:
            severity: critical
          annotations:
            summary: "Database backup failed"
            description: "The last nightly dump of MariaDB and PostgreSQL didn't succeed. Check: kubectl -n database get backups.k8up.io"
        - alert: DatabaseBackupMissing
          expr: increase(k8up_jobs_successful_counter{exported_namespace="database", jobType="backup"}[26h]) < 1
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: "No database backup for 26h"
            description: "The last successful dump of MariaDB and PostgreSQL is older than a day."
