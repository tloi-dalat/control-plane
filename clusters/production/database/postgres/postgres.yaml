apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  instances: 2
  enablePDB: false
  storage:
    size: 20Gi
    storageClass: local-static
  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: 256MB
      hot_standby_feedback: "on"
  env:
    - name: BACKUP_PASSWORD
      valueFrom:
        secretKeyRef: { name: postgres-backup, key: password }
  inheritedMetadata:
    annotations:
      k8up.io/backupcommand: sh -c 'PGPASSWORD="$BACKUP_PASSWORD" pg_dumpall -h postgres-secondary -U backup --clean --if-exists --no-role-passwords'
      k8up.io/backupcommand-container: postgres
      k8up.io/file-extension: .sql
  managed:
    services:
      disabledDefaultServices: [ro, r]
      additional:
        - selectorType: rw
          serviceTemplate:
            metadata: { name: postgres-primary }
          updateStrategy: patch
        - selectorType: ro
          serviceTemplate:
            metadata: { name: postgres-secondary }
          updateStrategy: patch
    roles:
      - name: newsletter
        ensure: present
        login: true
        inherit: true
        connectionLimit: -1
        passwordSecret: { name: postgres-newsletter }
      - name: url_shortener
        ensure: present
        login: true
        inherit: true
        connectionLimit: -1
        passwordSecret: { name: postgres-url-shortener }
      - name: sqllab
        ensure: present
        login: true
        inherit: true
        connectionLimit: -1
        inRoles: [pg_read_all_data]
        passwordSecret: { name: postgres-sqllab }
      - name: backup
        ensure: present
        login: true
        inherit: true
        connectionLimit: -1
        bypassrls: true
        inRoles: [pg_read_all_data]
        passwordSecret: { name: postgres-backup }
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { memory: 1Gi }
