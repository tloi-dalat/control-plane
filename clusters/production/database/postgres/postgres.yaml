apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  instances: 2
  enablePDB: false
  storage:
    size: 20Gi
    storageClass: local-static
  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: 256MB
      hot_standby_feedback: "on"
  inheritedMetadata:
    annotations:
      k8up.io/backupcommand: pg_dumpall --clean --if-exists
      k8up.io/backupcommand-container: postgres
      k8up.io/file-extension: .sql
  managed:
    services:
      disabledDefaultServices: [ro, r]
      additional:
        - selectorType: rw
          serviceTemplate:
            metadata: { name: postgres-primary }
        - selectorType: ro
          serviceTemplate:
            metadata: { name: postgres-secondary }
    roles:
      - name: newsletter
        ensure: present
        login: true
        passwordSecret: { name: postgres-newsletter }
      - name: url_shortener
        ensure: present
        login: true
        passwordSecret: { name: postgres-url-shortener }
      - name: sqllab
        ensure: present
        login: true
        inRoles: [pg_read_all_data]
        passwordSecret: { name: postgres-sqllab }
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { memory: 1Gi }
