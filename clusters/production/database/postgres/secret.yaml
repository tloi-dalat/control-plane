apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: postgres-roles
  namespace: database
spec:
  infisicalAuthRef: { name: tloi, namespace: infisical }
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectSlug: control-plane
      environmentSlug: production
      secretPath: /database/postgres
      recursive: false
  targets:
    - name: postgres-sqllab
      namespace: database
      kind: Secret
      secretType: kubernetes.io/basic-auth
      creationPolicy: Owner
      metadata:
        labels: { cnpg.io/reload: "true" }
        annotations: {}
      template:
        engineVersion: v1
        data:
          username: sqllab
          password: "{{ .SQLLAB_PASSWORD.Value }}"
    - name: postgres-newsletter
      namespace: database
      kind: Secret
      secretType: kubernetes.io/basic-auth
      creationPolicy: Owner
      metadata:
        labels: { cnpg.io/reload: "true" }
        annotations: {}
      template:
        engineVersion: v1
        data:
          username: newsletter
          password: "{{ .NEWSLETTER_PASSWORD.Value }}"
    - name: postgres-url-shortener
      namespace: database
      kind: Secret
      secretType: kubernetes.io/basic-auth
      creationPolicy: Owner
      metadata:
        labels: { cnpg.io/reload: "true" }
        annotations: {}
      template:
        engineVersion: v1
        data:
          username: url_shortener
          password: "{{ .URL_SHORTENER_PASSWORD.Value }}"
