apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: discord
  namespace: monitoring
spec:
  route:
    receiver: discord-alert
    groupBy: [alertname, namespace]
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 12h
    routes:
      - receiver: discord-alert
        matchers:
          - { name: alertname, value: Watchdog, matchType: "=" }
        repeatInterval: 24h
      - receiver: discord-report
        matchers:
          - { name: severity, value: report, matchType: "=" }
        repeatInterval: 24h
      - receiver: "null"
        matchers:
          - { name: severity, value: "info|none", matchType: "=~" }
  inhibitRules:
    - sourceMatch:
        - { name: severity, value: critical, matchType: "=" }
      targetMatch:
        - { name: severity, value: warning, matchType: "=" }
      equal: [namespace, alertname]
  receivers:
    - name: "null"
    - name: discord-alert
      discordConfigs:
        - apiURL: { name: prometheus-env, key: DISCORD_WEBHOOK_ALERT_URL }
          sendResolved: true
          content: '{{ if ne .CommonLabels.alertname "Watchdog" }}{{ template "alert.prefix" . }}{{ end }}'
          title: '{{ template "alert.title" . }}'
          message: '{{ template "alert.message" . }}'
    - name: discord-report
      slackConfigs:
        - apiURL: { name: prometheus-env, key: DISCORD_WEBHOOK_SLACK_REPORT_URL }
          sendResolved: false
          color: "#3498DB"
          pretext: '{{ template "report.prefix" . }}'
          title: '{{ template "report.title" . }}'
          text: '{{ template "report.message" . }}'
