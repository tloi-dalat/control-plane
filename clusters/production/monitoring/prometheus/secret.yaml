apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: prometheus-env
  namespace: monitoring
spec:
  infisicalAuthRef: { name: tloi, namespace: infisical }
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectSlug: control-plane
      environmentSlug: production
      secretPath: /monitoring/prometheus
      recursive: false
  targets:
    - name: prometheus-env
      namespace: monitoring
      kind: Secret
      creationPolicy: Owner
    - name: alert-prefix
      namespace: monitoring
      kind: Secret
      creationPolicy: Owner
      template:
        engineVersion: v1
        data:
          prefix.tmpl: '{{ "{{" }} define "alert.prefix" {{ "}}" }}{{ .DISCORD_ALERT_PREFIX.Value }}{{ "{{" }} end {{ "}}" }}'
