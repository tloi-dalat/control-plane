apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: prometheus-env
  namespace: monitoring
spec:
  infisicalAuthRef: { name: tloi, namespace: infisical }
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectSlug: control-plane
      environmentSlug: production
      secretPath: /monitoring/prometheus
      recursive: false
  targets:
    - name: prometheus-env
      namespace: monitoring
      kind: Secret
      creationPolicy: Owner
    - name: notification-prefix
      namespace: monitoring
      kind: Secret
      creationPolicy: Owner
      template:
        engineVersion: v1
        data:
          prefix.tmpl: |-
            {{ "{{" }} define "alert.prefix" {{ "}}" }}{{ .DISCORD_ALERT_PREFIX.Value }}{{ "{{" }} end {{ "}}" }}
            {{ "{{" }} define "alert.firing" {{ "}}" }}{{ .DISCORD_ALERT_FIRING_PREFIX.Value }}{{ "{{" }} end {{ "}}" }}
            {{ "{{" }} define "alert.resolved" {{ "}}" }}{{ .DISCORD_ALERT_RESOLVED_PREFIX.Value }}{{ "{{" }} end {{ "}}" }}
            {{ "{{" }} define "report.prefix" {{ "}}" }}{{ .DISCORD_REPORT_PREFIX.Value }}{{ "{{" }} end {{ "}}" }}
            {{ "{{" }} define "report.info" {{ "}}" }}{{ .DISCORD_REPORT_INFO_PREFIX.Value }}{{ "{{" }} end {{ "}}" }}
