apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
spec:
  selector:
    app.kubernetes.io/name: prometheus
    operator.prometheus.io/name: monitoring-prometheus
  ports:
    - { name: web, port: 9090, targetPort: web }
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  selector:
    app.kubernetes.io/name: alertmanager
    alertmanager: monitoring-alertmanager
  ports:
    - { name: web, port: 9093, targetPort: web }
