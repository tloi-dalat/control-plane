apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: platform
resources:
  - secret.yaml
  - storage.yaml
  - networkpolicy.yaml
helmGlobals:
  chartHome: /tmp/charts
helmCharts:
  - repo: https://runatlantis.github.io/helm-charts
    name: atlantis
    version: 6.16.1
    namespace: platform
    releaseName: atlantis
    valuesFile: values.yaml
