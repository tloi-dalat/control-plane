apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: atlantis
spec:
  podSelector:
    matchLabels: { app: atlantis, release: atlantis }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: cloudflared }
      ports:
        - { port: 4141, protocol: TCP }
