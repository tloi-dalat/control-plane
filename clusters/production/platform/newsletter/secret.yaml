apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: newsletter-env
  namespace: platform
spec:
  infisicalAuthRef: { name: tloi, namespace: infisical }
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectSlug: control-plane
      environmentSlug: production
      secretPath: /platform/newsletter
      recursive: false
  targets:
    - name: newsletter-env
      namespace: platform
      kind: Secret
      creationPolicy: Owner
