apiVersion: v1
kind: PersistentVolume
metadata:
  name: platform-prd-sqllab
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  capacity:
    storage: 1Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-static
  local:
    path: /home/tloi/data/platform/sqllab
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - { key: tloi.vn/data-node, operator: In, values: ["true"] }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sqllab
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  storageClassName: local-static
  volumeName: platform-prd-sqllab
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
