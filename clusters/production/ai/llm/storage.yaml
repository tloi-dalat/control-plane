apiVersion: v1
kind: PersistentVolume
metadata:
  name: ai-llm
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  capacity:
    storage: 20Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-static
  local:
    path: /home/tloi/data/ai/llm
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - { key: tloi.vn/data-node, operator: In, values: ["true"] }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llm
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  storageClassName: local-static
  volumeName: ai-llm
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
