model_list:
  - model_name: local
    litellm_params:
      model: ollama_chat/local
      api_base: http://llm.ai.svc.cluster.local:11434

mcp_servers:
  search:
    url: http://search-mcp.ai.svc.cluster.local:3000/mcp
    transport: http
    auth_type: bearer_token
    auth_value: os.environ/SEARCH_MCP_TOKEN
    allowed_tools: [searxng_web_search, web_url_read]
  browser:
    url: http://browser-mcp.ai.svc.cluster.local:11235/mcp/sse
    transport: sse
    auth_type: bearer_token
    auth_value: os.environ/BROWSER_MCP_TOKEN
    allowed_tools: [md]
  sandbox:
    url: http://sandbox-mcp.ai.svc.cluster.local:4040/mcp
    transport: http
    auth_type: bearer_token
    auth_value: os.environ/SANDBOX_MCP_TOKEN
    static_headers:
      Host: localhost:4040
    allowed_tools: [use_notebook, execute_code, list_files]

litellm_settings:
  drop_params: true
  request_timeout: 300

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
