apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - secret.yaml
  - service.yaml
helmGlobals:
  chartHome: /tmp/charts
helmCharts:
  - repo: oci://ghcr.io/tloi-dalat/charts
    name: app
    version: 0.3.0
    namespace: ai
    releaseName: browser
    valuesFile: values.yaml
patches:
  - target: { group: apps, kind: Deployment }
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: any
        annotations:
          secrets.infisical.com/auto-reload: "true"
      spec:
        template:
          spec:
            runtimeClassName: gvisor
