apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - runtimeclass.yaml
  - secret.yaml
helmGlobals:
  chartHome: /tmp/charts
helmCharts:
  - repo: oci://ghcr.io/tloi-dalat/charts
    name: app
    version: 0.3.0
    namespace: ai
    releaseName: sandbox
    valuesFile: values.yaml
  - repo: oci://ghcr.io/tloi-dalat/charts
    name: app
    version: 0.3.0
    namespace: ai
    releaseName: sandbox-mcp
    valuesFile: sandbox-mcp.yaml
patches:
  - target: { group: apps, kind: Deployment }
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: any
        annotations:
          secrets.infisical.com/auto-reload: "true"
  - target: { group: apps, kind: Deployment, name: sandbox }
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: sandbox
      spec:
        template:
          spec:
            runtimeClassName: gvisor
