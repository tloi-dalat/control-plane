apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - secret.yaml
helmGlobals:
  chartHome: /tmp/charts
helmCharts:
  - repo: oci://ghcr.io/tloi-dalat/charts
    name: app
    version: 0.3.0
    namespace: ai
    releaseName: search
    valuesFile: values.yaml
  - repo: oci://ghcr.io/tloi-dalat/charts
    name: app
    version: 0.3.0
    namespace: ai
    releaseName: search-mcp
    valuesFile: search-mcp.yaml
configMapGenerator:
  - name: search-config
    namespace: ai
    files: [settings.yml]
    options:
      disableNameSuffixHash: true
patches:
  - target: { group: apps, kind: Deployment }
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: any
        annotations:
          secrets.infisical.com/auto-reload: "true"
