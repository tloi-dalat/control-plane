apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: search-env
  namespace: ai
spec:
  infisicalAuthRef: { name: tloi, namespace: infisical }
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectSlug: control-plane
      environmentSlug: production
      secretPath: /ai/search
      recursive: false
  targets:
    - name: search-env
      namespace: ai
      kind: Secret
      creationPolicy: Owner
