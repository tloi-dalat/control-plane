# The cluster's one way in, shared by every namespace: an outbound Cloudflare
# Tunnel. It is remotely managed: the tunnel, its routes and the DNS records
# live in tloi-dalat/terraform-cloudflare (zero-trust/tunnel/tunnels/
# control-plane-production.yaml). This app only runs the connector with the
# tunnel token, so a new hostname is a PR there, not here.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - cloudflared-token.yaml
helmGlobals:
  chartHome: /tmp/charts
helmCharts:
  - repo: oci://ghcr.io/tloi-dalat/charts
    name: app
    version: 0.2.0
    namespace: cloudflared
    releaseName: cloudflared-tunnel
    valuesFile: values.yaml
# Restart the connectors when Terraform rotates the token in Infisical.
patches:
  - target: { group: apps, kind: Deployment|StatefulSet }
    patch: |-
      apiVersion: apps/v1
      kind: Deployment   # ignored: `target` picks the resources
      metadata:
        name: any
        annotations:
          secrets.infisical.com/auto-reload: "true"
