image:
  repository: cloudflare/cloudflared
  tag: 2026.9.3
replicaCount: 2
args: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "run"]
env:
  TUNNEL_TOKEN:
    valueFrom: { secretKeyRef: { name: cloudflared-token, key: TUNNEL_TOKEN } }
ports:
  - { name: metrics, containerPort: 2000 }
service: { enabled: false }
probes:
  liveness: { httpGet: { path: /ready, port: metrics }, initialDelaySeconds: 10, periodSeconds: 10, failureThreshold: 3 }
  readiness: { httpGet: { path: /ready, port: metrics }, periodSeconds: 10 }
podSecurityContext: { runAsUser: 65532, runAsGroup: 65532, runAsNonRoot: true }
resources:
  requests: { cpu: 10m, memory: 32Mi }
  limits: { cpu: 250m, memory: 128Mi }
