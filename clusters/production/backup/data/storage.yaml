apiVersion: v1
kind: PersistentVolume
metadata:
  name: backup-data
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  capacity:
    storage: 500Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-static
  local:
    path: /home/tloi/data
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - { key: tloi.vn/data-node, operator: In, values: ["true"] }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    k8up.io/backup-restic-args: '["--exclude", "/data/data/database", "--exclude", "/data/data/monitoring"]'
spec:
  storageClassName: local-static
  volumeName: backup-data
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 500Gi
