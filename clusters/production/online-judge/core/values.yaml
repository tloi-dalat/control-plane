image:
  repository: ghcr.io/tloi-dalat/oj-core
  tag: 0.1.1

env:
  ENV: prd
  SITE__DOMAIN: oj.tloi.vn
  SITE__NAME: TLOJ
  DJANGO__DEBUG: "false"
  DJANGO__REGISTRATION_OPEN: "true"
  AUTH__OAUTH_ONLY: "true"
  MYSQL__HOST: "10.42.0.1"
  MYSQL__PORT: "3306"
  MYSQL__DATABASE: dmoj
  MYSQL__USER: dmoj_k8s
  REDIS__HOST: online-judge-redis
  REDIS__CACHE_DB: "1"
  REDIS__CELERY_DB: "2"
  PROBLEM__DATA_ROOT: /problems
  MEDIA__ROOT: /media
  BRIDGE__CONNECT_HOST: online-judge-bridge
  EVENT__POST: ws://online-judge-wsevent:15101/
  MAIL__BACKEND: django.core.mail.backends.smtp.EmailBackend
  MAIL__HOST: mail.tloi.vn
  MAIL__PORT: "587"
  MAIL__USE_TLS: "true"
  MAIL__USER: no-reply@tloi.vn
  MAIL__FROM: Thang Long Da Lat Olympiad in Informatics <no-reply@tloi.vn>
  MAIL__SERVER_EMAIL: Thang Long Da Lat Olympiad in Informatics <no-reply@tloi.vn>
  MAIL__ADMINS: kitsune:minhquandinhcao@gmail.com
  SOCIAL__GOOGLE_KEY: 15854195969-1d595g1fuu6fu6qabi0ht7952sm01tq4.apps.googleusercontent.com
  POLYGON__API_USERNAME: tloj
  LOG__LEVEL: INFO

envFrom:
  - secretRef: { name: online-judge-core-env }

podSecurityContext:
  runAsUser: 1001
  runAsGroup: 1001
  runAsNonRoot: true

volumes:
  - name: media
    persistentVolumeClaim: { claimName: online-judge-media }
  - name: problems
    persistentVolumeClaim: { claimName: online-judge-problems }
volumeMounts:
  - { name: media, mountPath: /media }
  - { name: problems, mountPath: /problems }
