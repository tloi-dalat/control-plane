image:
  repository: ghcr.io/tloi-dalat/oj-core
  tag: 0.2.0

env:
  SITE_FULL_URL: https://oj.tloi.vn
  SITE_NAME: TLOJ
  DEBUG: "false"
  REGISTRATION_OPEN: "true"
  OAUTH_ONLY: "true"
  DATABASE_HOST: "10.42.0.1"
  DATABASE_PORT: "3306"
  DATABASE_NAME: dmoj
  DATABASE_USER: dmoj_k8s
  REDIS_HOST: online-judge-redis
  REDIS_CACHE_DB: "1"
  REDIS_CELERY_DB: "2"
  DMOJ_PROBLEM_DATA_ROOT: /problems
  MEDIA_ROOT: /media
  BRIDGED_DJANGO_CONNECT: online-judge-bridge:9998
  EVENT_DAEMON_POST: ws://online-judge-wsevent:15101/
  EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
  EMAIL_HOST: mail.tloi.vn
  EMAIL_PORT: "587"
  EMAIL_USE_TLS: "true"
  EMAIL_HOST_USER: no-reply@tloi.vn
  DEFAULT_FROM_EMAIL: Thang Long Da Lat Olympiad in Informatics <no-reply@tloi.vn>
  SERVER_EMAIL: Thang Long Da Lat Olympiad in Informatics <no-reply@tloi.vn>
  ADMINS: kitsune:minhquandinhcao@gmail.com
  VNOJ_POLYGON_API_USERNAME: tloj
  LOG_LEVEL: INFO

envFrom:
  - secretRef: { name: online-judge-core-env }

podSecurityContext:
  runAsUser: 1001
  runAsGroup: 1001
  runAsNonRoot: true

volumes:
  - name: media
    persistentVolumeClaim: { claimName: online-judge-media }
  - name: problems
    persistentVolumeClaim: { claimName: online-judge-problems }
volumeMounts:
  - { name: media, mountPath: /media }
  - { name: problems, mountPath: /problems }
