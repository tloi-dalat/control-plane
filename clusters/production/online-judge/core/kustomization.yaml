apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmGlobals:
  chartHome: /tmp/charts
helmCharts:
  - repo: oci://ghcr.io/tloi-dalat/charts
    name: app
    version: 0.2.0
    namespace: online-judge
    releaseName: online-judge-site
    valuesFile: values.yaml
    additionalValuesFiles: [site.yaml]
  - repo: oci://ghcr.io/tloi-dalat/charts
    name: app
    version: 0.2.0
    namespace: online-judge
    releaseName: online-judge-bridge
    valuesFile: values.yaml
    additionalValuesFiles: [bridge.yaml]
  - repo: oci://ghcr.io/tloi-dalat/charts
    name: app
    version: 0.2.0
    namespace: online-judge
    releaseName: online-judge-celery
    valuesFile: values.yaml
    additionalValuesFiles: [celery.yaml]
patches:
  - target: { group: apps, kind: Deployment|StatefulSet }
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: any
        annotations:
          secrets.infisical.com/auto-reload: "true"
  - target: { group: apps, kind: Deployment }
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: any
      spec:
        template:
          spec:
            hostAliases:
              - ip: 10.42.0.1
                hostnames: [mail.tloi.vn]
