# User uploads, read-only. Same paths upstream VNOJ's nginx serves from /media.
server {
    listen 8080;
    server_tokens off;
    root /media;

    location ~ ^/(martor|pdf|submission_file|static-upload)/ {
        add_header X-Content-Type-Options nosniff always;
        expires 7d;

        # SVG is an allowed martor upload. Opened directly, a scripted SVG would
        # run with the site's origin; the sandbox CSP stops that. <img> embeds
        # are unaffected. (nginx doesn't inherit add_header into a nested block,
        # hence the repeat.)
        location ~* \.svg$ {
            add_header X-Content-Type-Options nosniff always;
            add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; sandbox" always;
            expires 7d;
        }
    }

    location / {
        return 404;
    }
}
