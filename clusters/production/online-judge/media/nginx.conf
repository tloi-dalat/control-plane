server {
    listen 8080;
    server_tokens off;
    root /media;

    location ~ ^/(martor|pdf|submission_file|static-upload)/ {
        add_header X-Content-Type-Options nosniff always;
        expires 7d;

        location ~* \.svg$ {
            add_header X-Content-Type-Options nosniff always;
            add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; sandbox" always;
            expires 7d;
        }
    }

    location / {
        return 404;
    }
}
