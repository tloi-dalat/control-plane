apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmGlobals:
  chartHome: /tmp/charts
helmCharts:
  - repo: oci://ghcr.io/tloi-dalat/charts
    name: app
    version: 0.3.0
    namespace: online-judge
    releaseName: media
    valuesFile: values.yaml
configMapGenerator:
  - name: media-nginx
    files: [default.conf=nginx.conf]
