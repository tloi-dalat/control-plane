apiVersion: v1
kind: PersistentVolume
metadata:
  name: online-judge-prd-problems
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  capacity:
    storage: 100Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-static
  local:
    path: /home/tloi/data/online-judge/problems
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - { key: tloi.vn/data-node, operator: In, values: ["true"] }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: online-judge-problems
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  storageClassName: local-static
  volumeName: online-judge-prd-problems
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 100Gi
