# Problem test data (DMOJ_PROBLEM_DATA_ROOT). Site and celery write it; bridge and judge mount it read-only.
#
# SAFETY: persistentVolumeReclaimPolicy Retain + Prune=false/Delete=false.
# The ApplicationSet prunes; without these, a renamed directory or a bad revert
# could delete the volume. With them, the worst case is an unbound volume you
# reattach by hand — the files are never touched.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: online-judge-prd-problems
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  capacity:
    storage: 100Gi
  accessModes: [ReadWriteOnce]       # one node; several pods on it may mount it
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-static
  local:
    path: /CHANGEME/online-judge/problems   # existing directory on the production VPS (must exist)
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - { key: tloi.vn/data-node, operator: In, values: ["true"] }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: online-judge-problems
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  storageClassName: local-static
  volumeName: online-judge-prd-problems                # bind to exactly this volume
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 100Gi
