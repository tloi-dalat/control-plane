# websocket/daemon.js — live submission and contest updates.
# Exactly one replica: the message queue lives in memory.
# PRODUCTION: same release tag as ../core/values.yaml (both come from tloi-dalat/TLOJ).
image:
  repository: ghcr.io/tloi-dalat/oj-wsevent
  tag: 0.1.0
replicaCount: 1
strategy: { type: Recreate }
ports:
  - { name: ws, containerPort: 15100 }     # browsers   ← cloudflared /event/
  - { name: post, containerPort: 15101 }   # site posts events (cluster-internal)
  - { name: poll, containerPort: 15102 }   # long-poll  ← cloudflared /channels/
probes:
  readiness: { tcpSocket: { port: poll }, periodSeconds: 10 }
  liveness: { tcpSocket: { port: poll }, periodSeconds: 20, failureThreshold: 6 }
podSecurityContext: { runAsUser: 1000, runAsGroup: 1000, runAsNonRoot: true }   # `node` user in the image
resources:
  requests: { cpu: 20m, memory: 64Mi }
  limits: { cpu: 250m, memory: 192Mi }
