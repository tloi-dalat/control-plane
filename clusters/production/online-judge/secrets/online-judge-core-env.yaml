# Infisical TLOI project → environment "production" → folder /online-judge/core
#   DJANGO__SECRET_KEY  MYSQL__PASSWORD  REDIS__PASSWORD  SOCIAL__GOOGLE_SECRET
#   EVENT__SUBMISSION_KEY  EVENT__CONTEST_KEY  EVENT__TICKET_KEY  MAIL__PASSWORD
#   POLYGON__API_KEY  POLYGON__API_SECRET  MOSS__API_KEY
#   DISCORD__ON_NEW_TICKET  DISCORD__ON_ERROR  DISCORD__ON_LONG_QUEUE  DISCORD__QUEUE_TIME_STATS
# DJANGO__SECRET_KEY is the OLD production SECRET_KEY, not a new one: it keeps
# everyone logged in across the cutover and decrypts the stored 2FA secrets.
# becomes Secret online-judge-core-env (same key names). core/ (site, bridge,
# celery, migrate) loads it with envFrom; redis reads REDIS__PASSWORD from it.
# Edit a value in the web UI → Secret updated within refreshInterval → pods
# annotated secrets.infisical.com/auto-reload restart on their own.
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: online-judge-core-env
  namespace: online-judge
spec:
  infisicalAuthRef: { name: tloi, namespace: infisical }
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectSlug: control-plane   # Infisical → TLOI project → Settings → Project slug
      environmentSlug: production
      secretPath: /online-judge/core
      recursive: false
  targets:
    - name: online-judge-core-env
      namespace: online-judge
      kind: Secret
      creationPolicy: Owner                # deleted together with this resource
