apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: online-judge-judge-env
  namespace: online-judge
spec:
  infisicalAuthRef: { name: tloi, namespace: infisical }
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectSlug: control-plane
      environmentSlug: production
      secretPath: /online-judge/judge
      recursive: false
  targets:
    - name: online-judge-judge-env
      namespace: online-judge
      kind: Secret
      creationPolicy: Owner
