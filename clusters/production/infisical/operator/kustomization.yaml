apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmCharts:
  - repo: https://dl.cloudsmith.io/public/infisical/helm-charts/helm/charts/
    name: secrets-operator
    version: v0.11.9
    namespace: infisical
    releaseName: infisical-operator
    valuesInline:
      installCRDs: true
      controllerManager:
        manager:
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits: { memory: 128Mi }
