# How the operator logs in to Infisical Cloud. Every InfisicalStaticSecret in
# the cluster points at the InfisicalAuth here (infisicalAuthRef).
#
# The login itself (Secret infisical-bootstrap: the machine identity's client
# ID/secret) is NOT in git: it's the one credential that can't live in
# Infisical. It is created once per cluster with
#   bootstrap/infisical-login.sh production
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - connection.yaml
  - auth.yaml
